<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión · Cine</title>
    <link rel="stylesheet" href="/estilos.css">
    <style>
        #formulario input { width: min(100%, 320px); margin: 8px 0; }
        #formulario, #sesion { padding: 20px; background: #16213e; border-radius: 8px; }
    </style>
    <script src="/login.js" defer></script>
</head>
<body>
<main class="contenedor">
    <nav><a href="/">Mapa de asientos</a> · <a href="/vista-asiento.html">Vista desde el asiento</a></nav>
    <h1>Iniciar sesión</h1>
    <form id="formulario" class="panel">
        <p><label for="usuario">Usuario</label><br>
        <input id="usuario" name="username" autocomplete="username" maxlength="100" required></p>
        <p><label for="contrasena">Contraseña</label><br>
        <input id="contrasena" name="password" type="password" autocomplete="current-password" maxlength="200" required></p>
        <button id="entrar" type="submit">Entrar</button>
    </form>
    <section id="sesion" class="panel" hidden>
        <h2 id="bienvenida"></h2>
        <p><a href="/vista-asiento.html">Explorar la vista de los asientos</a></p>
        <button id="salir" type="button">Cerrar sesión</button>
    </section>
    <p id="mensaje" role="status" aria-live="polite"></p>
</main>
</body>
</html>
