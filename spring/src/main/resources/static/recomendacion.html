<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recomendación de asientos</title>
    <link rel="stylesheet" href="/estilos.css">
</head>
<body>
    <main class="contenedor">
        <nav aria-label="Navegación"><a href="/">Mapa de asientos</a><a href="/vista-asiento.html">Vista desde el asiento</a></nav>
        <h1>Recomendar mejores asientos</h1>
        <p>Indica cuántas personas asistirán. El sistema buscará lugares disponibles, consecutivos y con buena vista.</p>

        <label for="cantidad">Cantidad de personas:</label>
        <input id="cantidad" type="number" min="1" max="8" value="1">
        <button id="boton-recomendar" type="button">Recomendar</button>

        <div id="resultado" aria-live="polite"></div>
        <a class="volver" href="/">Volver al mapa de asientos</a>
    </main>

    <script>
        const boton = document.getElementById('boton-recomendar');
        const resultado = document.getElementById('resultado');

        boton.addEventListener('click', buscarRecomendacion);

        function buscarRecomendacion() {
            const cantidad = Number(document.getElementById('cantidad').value);

            if (!Number.isInteger(cantidad) || cantidad < 1) {
                resultado.innerHTML = '<p class="mensaje">Ingresa una cantidad válida.</p>';
                return;
            }

            resultado.innerHTML = '<p>Buscando los mejores asientos...</p>';

            fetch(`/api/recomendaciones/mejores?cantidad=${cantidad}`)
                .then(response => response.json())
                .then(data => {
                    resultado.innerHTML = '';

                    if (data.error) {
                        resultado.innerHTML = `<p class="mensaje">${data.error}</p>`;
                        return;
                    }

                    const mensaje = document.createElement('p');
                    mensaje.className = 'mensaje';
                    mensaje.innerText = data.mensaje;
                    resultado.appendChild(mensaje);

                    data.asientos.forEach(asiento => {
                        const tarjeta = document.createElement('div');
                        tarjeta.className = 'asiento-recomendado';
                        tarjeta.innerText = `${asiento.fila}-${asiento.numero}\nDistancia: ${asiento.distanciaPantalla} m\nÁngulo: ${asiento.anguloVision}°\nCalificación: ${asiento.nivelConveniencia}/5`;
                        resultado.appendChild(tarjeta);
                    });
                })
                .catch(() => {
                    resultado.innerHTML = '<p class="mensaje">No se pudo obtener la recomendación.</p>';
                });
        }
    </script>
</body>
</html>
